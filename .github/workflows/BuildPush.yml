
name: Print on Push

on:
  push:
    branches:
      - main   # You can change this to any branch you want

jobs:
  print-message:
    runs-on: windows-latest   # This uses a Windows x64 environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Print statement
        run: echo "Code has been pushed to the repository!"
