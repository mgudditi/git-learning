name: Java Build on Merge to Main

on:
  push:
    branches:
      - main   # Trigger only when code is merged/pushed into main

jobs:
  build-java:
    runs-on: windows-latest   # Windows x64 environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'   # Popular OpenJDK distribution
          java-version: '17'        # Adjust to your project version (e.g., 11, 17, 21)

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Print statement
        run: echo "Branch has been merged into main and Java build completed successfully!"
